services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: wikipath
      POSTGRES_USER: wikipath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD manquant}
    ports:
    - 127.0.0.1:7474:7474
    - 127.0.0.1:7687:7687
    volumes:
    - neo4j_data:/data
    - neo4j_logs:/logs
    - ./database/neo4j/import:/var/lib/neo4j/import
    healthcheck:
      test:
      - CMD-SHELL
      - cypher-shell -a bolt://localhost:7687 -u neo4j -p "$${NEO4J_AUTH#*/}" -d neo4j
        "RETURN 1;" || exit 1
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 60s
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c " python manage.py migrate && python manage.py runserver 0.0.0.0:8000
      "
    volumes:
    - ./backend:/app
    ports:
    - 8000:8000
    depends_on:
      db:
        condition: service_healthy
    env_file:
    - .env
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    volumes:
    - ./frontend:/app
    - vue_node_modules:/app/node_modules
    ports:
    - 127.0.0.1:5173:5173
    environment:
      BOILR_API_PROXY_TARGET: http://backend:8000
volumes:
  postgres_data: {}
  neo4j_data: {}
  neo4j_logs: {}
  vue_node_modules: {}
